name: Build ANGKOR WAT RUN Android

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "www/**"
      - "assets/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Apply ANGKOR WAT RUN Android launcher icon
        run: |
          npm install --no-save sharp
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const svg = fs.readFileSync('assets/angkor-run-icon.svg');
          const root = 'android/app/src/main/res';
          const sizes = { mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192 };
          (async () => {
            for (const [density,size] of Object.entries(sizes)) {
              const dir = path.join(root, 'mipmap-' + density);
              fs.mkdirSync(dir, {recursive:true});
              const png = await sharp(svg).resize(size,size).png().toBuffer();
              fs.writeFileSync(path.join(dir,'ic_launcher.png'),png);
              fs.writeFileSync(path.join(dir,'ic_launcher_round.png'),png);
            }
            const drawable = path.join(root,'drawable-nodpi');
            fs.mkdirSync(drawable, {recursive:true});
            const foreground = await sharp({create:{width:432,height:432,channels:4,background:{r:0,g:0,b:0,alpha:0}}})
              .composite([{input:await sharp(svg).resize(360,360).png().toBuffer(),left:36,top:36}])
              .png().toBuffer();
            fs.writeFileSync(path.join(drawable,'ic_launcher_foreground.png'),foreground);
            const anydpi = path.join(root,'mipmap-anydpi-v26');
            fs.mkdirSync(anydpi, {recursive:true});
            const adaptive = `<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background><color android:color="#142d4b"/></background>
              <foreground><bitmap android:src="@drawable/ic_launcher_foreground" android:gravity="center"/></foreground>
          </adaptive-icon>`;
            fs.writeFileSync(path.join(anydpi,'ic_launcher.xml'),adaptive);
            fs.writeFileSync(path.join(anydpi,'ic_launcher_round.xml'),adaptive);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Build debug APK and release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angkor-wat-run-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
