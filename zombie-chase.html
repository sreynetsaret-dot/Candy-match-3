<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101b2b"><title>Zombie Chase 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b2b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100dvh;background:linear-gradient(#152b3c 0%,#263b43 55%,#171e25 100%)}.hud{position:fixed;inset:env(safe-area-inset-top) 0 auto;display:flex;justify-content:space-between;padding:14px 15px;pointer-events:none;text-shadow:0 2px 5px #000;font-weight:1000}.pill{background:#07111dcc;border:1px solid #ffffff44;border-radius:14px;padding:8px 12px}.top{display:flex;gap:8px}.back{position:fixed;top:calc(env(safe-area-inset-top) + 68px);left:14px;border:1px solid #ffffff55;border-radius:12px;padding:9px 12px;background:#101b2bcc;color:#fff;font-weight:900;text-decoration:none}.controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:0;right:0;display:flex;justify-content:center;gap:14px}.controls button,.overlay button{width:65px;height:58px;border:2px solid #ffffff99;border-radius:18px;background:linear-gradient(#ffcf63,#ed8d32);color:#48230d;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #9b4c20}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#050b13b8;padding:24px}.panel{width:min(92vw,370px);padding:25px 20px;border:2px solid #ffffff55;border-radius:26px;background:linear-gradient(155deg,#293e50,#101c2b);text-align:center;box-shadow:0 20px 60px #0009}.panel h1{margin:0 0 8px;font-size:32px}.panel p{color:#d5e2e9;line-height:1.5}.panel button{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(#ffe27c,#ff9e36);color:#51270d;font-weight:1000;font-size:16px}.hidden{display:none!important}.hint{font-size:12px;color:#c6d4de}
</style></head><body>
<canvas id="game"></canvas><a class="back" href="index.html">← HOME</a>
<div class="hud"><div class="pill">🏃 <span id="score">0</span> m</div><div class="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🏆 <span id="best">0</span></div></div></div>
<div class="controls"><button id="left">◀</button><button id="jump">⬆</button><button id="slide">⬇</button><button id="right">▶</button></div>
<div class="overlay" id="start"><div class="panel"><h1>🧟 ZOMBIE CHASE</h1><p>Run, dodge trains and barriers, jump, slide and collect coins. Don't let the zombies catch you!</p><button id="play">START RUN</button><p class="hint">Swipe left/right to change lanes · Swipe up to jump · Swipe down to slide</p></div></div>
<div class="overlay hidden" id="over"><div class="panel"><h1>🧟 CAUGHT!</h1><p>Your run: <b id="final">0</b> m · Coins: <b id="earned">0</b></p><button id="again">RUN AGAIN</button><p class="hint">Try to beat your best distance.</p></div></div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,dpr,run=false,lane=1,target=1,jump=0,slide=0,dist=0,coins=0,speed=0.42,items=[],last=0,spawn=0,best=+(localStorage.zcBest||0),zombie=0;
$('best').textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function pathY(t){return h*.43+t*t*h*.72}function roadW(t){return w*(.13+t*.48)}function center(){return w/2}
function drawRoad(){let horizon=h*.37;x.fillStyle='#172b35';x.fillRect(0,0,w,horizon);for(let i=0;i<12;i++){let bx=(i*113+17)%w, bh=35+(i*37)%100;x.fillStyle=i%2?'#203b46':'#1c333d';x.fillRect(bx,horizon-bh,28,bh);for(let j=0;j<3;j++){x.fillStyle='#d5a95b55';x.fillRect(bx+5+j*8,horizon-bh+9,3,5)}}let top=w*.13,bottom=w*.61;x.fillStyle='#454b4d';x.beginPath();x.moveTo(center()-top,horizon);x.lineTo(center()+top,horizon);x.lineTo(center()+bottom,h);x.lineTo(center()-bottom,h);x.closePath();x.fill();x.strokeStyle='#d7d1a4';x.lineWidth=3;x.beginPath();x.moveTo(center()-top,horizon);x.lineTo(center()-bottom,h);x.moveTo(center()+top,horizon);x.lineTo(center()+bottom,h);x.stroke();for(let k=1;k<=2;k++){x.strokeStyle='#e8d9a088';x.lineWidth=2;for(let i=0;i<9;i++){let t=((i/9+dist*.012)%1),y=pathY(t),rw=roadW(t);x.beginPath();x.moveTo(center()+rw*(k/3-.5),y);x.lineTo(center()+rw*(k/3-.5),y+Math.max(2,t*10));x.stroke()}}}
function pos(l,t){let rw=roadW(t);return {x:center()+(l-1)*rw*.66,y:pathY(t),s:.18+t*1.55}}
function drawRunner(){let p=pos(lane,.83),bob=Math.sin(dist*.13)*4;x.save();x.translate(p.x,p.y-jump*85+bob);if(slide>0)x.scale(1,.55);x.fillStyle='#0008';x.beginPath();x.ellipse(0,7,20*p.s,7*p.s,0,0,Math.PI*2);x.fill();x.fillStyle='#e9b48a';x.beginPath();x.arc(0,-37*p.s,11*p.s,0,Math.PI*2);x.fill();x.fillStyle='#1f2937';x.fillRect(-10*p.s,-29*p.s,20*p.s,29*p.s);x.fillStyle='#e34e43';x.fillRect(-12*p.s,-27*p.s,24*p.s,9*p.s);x.strokeStyle='#d9e2e8';x.lineWidth=5*p.s;x.beginPath();x.moveTo(-5*p.s,-1);x.lineTo(-10*p.s,12*p.s);x.moveTo(5*p.s,-1);x.lineTo(10*p.s,12*p.s);x.stroke();x.restore()}
function drawZombie(){let p=pos(1,.91);p.y+=Math.sin(dist*.2)*4;x.save();x.translate(p.x,p.y);x.fillStyle='#0009';x.beginPath();x.ellipse(0,8,30,9,0,0,7);x.fill();x.fillStyle='#82a66b';x.fillRect(-17,-49,34,47);x.beginPath();x.arc(0,-57,15,0,7);x.fill();x.fillStyle='#e8f0dc';x.fillRect(-9,-61,5,5);x.fillRect(5,-61,5,5);x.strokeStyle='#263022';x.lineWidth=3;x.beginPath();x.moveTo(-7,-48);x.lineTo(7,-45);x.stroke();x.strokeStyle='#82a66b';x.lineWidth=8;x.beginPath();x.moveTo(-12,-38);x.lineTo(-29,-22);x.moveTo(12,-38);x.lineTo(28,-24);x.stroke();x.restore()}
function spawnItem(){let lane=Math.floor(Math.random()*3),kind=Math.random()<.52?'coin':Math.random()<.5?'barrier':'train';items.push({lane,t:0,kind,hit:false})}
function drawItems(){items.forEach(o=>{let p=pos(o.lane,o.t);if(o.kind==='coin'){x.fillStyle='#ffd447';x.beginPath();x.arc(p.x,p.y-14*p.s,9*p.s,0,7);x.fill();x.strokeStyle='#fff2a0';x.lineWidth=2;x.stroke()}else if(o.kind==='barrier'){x.fillStyle='#ed8b37';x.fillRect(p.x-17*p.s,p.y-26*p.s,34*p.s,26*p.s);x.fillStyle='#ffe0a2';x.fillRect(p.x-17*p.s,p.y-18*p.s,34*p.s,5*p.s)}else{x.fillStyle='#3c6477';x.fillRect(p.x-30*p.s,p.y-95*p.s,60*p.s,95*p.s);x.fillStyle='#a6d9e7';x.fillRect(p.x-22*p.s,p.y-82*p.s,44*p.s,24*p.s);x.fillStyle='#111';x.fillRect(p.x-23*p.s,p.y-9*p.s,13*p.s,13*p.s);x.fillRect(p.x+10*p.s,p.y-9*p.s,13*p.s,13*p.s)}})}
function end(){run=false;best=Math.max(best,Math.floor(dist));localStorage.zcBest=best;$('best').textContent=best;$('final').textContent=Math.floor(dist);$('earned').textContent=coins;$('over').classList.remove('hidden')}
function frame(ts){let dt=Math.min((ts-last)/16.67||1,2);last=ts;if(run){dist+=speed*dt*2.1;speed=Math.min(.85,.42+dist/1800);spawn+=dt;if(spawn>Math.max(23,54-speed*35)){spawn=0;spawnItem()}items.forEach(o=>{o.t+=.009*speed*dt;if(!o.hit&&o.t>.79&&o.t<.91&&o.lane===lane){if(o.kind==='coin'){coins++;o.hit=true;$('coins').textContent=coins}else if(o.kind==='barrier'&&jump<.35&&slide<.2){o.hit=true;end()}else if(o.kind==='train'&&jump<.45){o.hit=true;end()}}});items=items.filter(o=>o.t<1.12&&!o.hit);jump=Math.max(0,jump-.045*dt);slide=Math.max(0,slide-.06*dt);zombie=Math.min(1,zombie+.0007*dt);$('score').textContent=Math.floor(dist)}x.clearRect(0,0,w,h);drawRoad();drawItems();drawZombie();drawRunner();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function move(n){if(!run)return;lane=Math.max(0,Math.min(2,lane+n));target=lane}function actJump(){if(run&&jump===0){jump=1;slide=0}}function actSlide(){if(run){slide=1;jump=0}}
$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('jump').onclick=actJump;$('slide').onclick=actSlide;
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy)){move(dx>0?1:-1)}else if(dy< -20)actJump();else if(dy>20)actSlide()},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(e.key==='ArrowUp'||e.key===' ')actJump();if(e.key==='ArrowDown'||e.key==='s')actSlide()});
function start(){items=[];lane=1;dist=0;coins=0;speed=.42;spawn=0;jump=0;slide=0;zombie=0;$('score').textContent='0';$('coins').textContent='0';$('start').classList.add('hidden');$('over').classList.add('hidden');run=true} $('play').onclick=start;$('again').onclick=start;
})();
</script></body></html>
