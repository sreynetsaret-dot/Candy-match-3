<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#24134b">
<meta name="description" content="A colorful match-3 candy puzzle game. Swap candies, make matches and beat the target.">
<link rel="manifest" href="manifest.webmanifest">
<title>Candy Match 3</title>
<style>
:root{color-scheme:light;--pink:#f34c9a;--plum:#8b3478;--blue:#4b83c7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:linear-gradient(180deg,#ffb9df 0%,#f58ec8 26%,#ffd9a2 67%,#fff0a5 100%);display:flex;justify-content:center;padding:10px 5px 26px;overflow-x:hidden;position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(circle at 10% 18%,#fff 0 3px,transparent 4px),radial-gradient(circle at 85% 26%,#fff 0 4px,transparent 5px),radial-gradient(circle at 18% 68%,#fff 0 3px,transparent 4px),radial-gradient(circle at 91% 76%,#fff 0 5px,transparent 6px);background-size:170px 190px}
main{width:min(100%,600px);position:relative}
header{text-align:center;margin:0 0 11px;padding:9px 12px 10px;border-radius:20px;background:linear-gradient(180deg,#ff9fd0,#ed4d9f);border:2px solid #fff;box-shadow:0 5px 0 #b93481,0 8px 14px #8b347d35,inset 0 2px #fff}
h1{font-size:clamp(27px,7.5vw,36px);line-height:1.08;margin:0;color:#fff;text-shadow:0 3px 0 #a52d75,0 5px 8px #8b347d80}
header p{margin:6px 0 0;color:#fff;font-size:10px;font-weight:1000;letter-spacing:2px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;padding:7px;border-radius:18px;background:linear-gradient(180deg,#fff1fa,#f48bc6);border:2px solid #fff;box-shadow:0 4px 0 #bd4b91,0 7px 12px #88417935}
.stat{background:linear-gradient(180deg,#fff,#ffd4e9);border:1px solid #fff;border-radius:12px;text-align:center;padding:6px 2px;box-shadow:inset 0 -3px 5px #e9a4cb}
.stat small{display:block;color:#a43c7b;font-size:9px;text-transform:uppercase;letter-spacing:.5px;font-weight:1000}
.stat strong{display:block;font-size:clamp(18px,5vw,22px);line-height:1.3;color:#c32f7b;text-shadow:0 1px #fff}
.progress-wrap{height:15px;background:#704b91;border:2px solid #fff;border-radius:99px;overflow:hidden;margin:0 3px 12px;box-shadow:0 3px 0 #a24a8b}
.progress{height:100%;width:0;background:linear-gradient(90deg,#32c7f0,#67e3b3,#fff078);border-radius:99px;box-shadow:0 0 10px #fff;transition:width .25s}
.board{width:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:8px;background:linear-gradient(145deg,#86b7e8,#527fbd 55%,#365b99);border:3px solid #fff;border-radius:17px;box-shadow:0 7px 0 #38578d,0 13px 22px #75407855,inset 0 2px 6px #fff;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;min-width:0;border:1px solid #ffffffa0;border-radius:12px;background:linear-gradient(145deg,#a5c9ed 0%,#6f9fd5 56%,#4c79b5 100%);display:grid;place-items:center;font-size:clamp(34px,11vw,50px);padding:0;cursor:pointer;text-shadow:0 2px 2px #34527c90;box-shadow:inset 0 2px 5px #ffffffa0,inset 0 -3px 5px #284b8290,0 2px 2px #27467880;transition:transform .14s,filter .14s;position:relative;overflow:hidden}
.cell:after{content:"";position:absolute;inset:2px 3px auto;height:30%;border-radius:8px;background:linear-gradient(#ffffff90,transparent);pointer-events:none}
.cell:active{transform:scale(.9)}
.cell.selected{background:linear-gradient(145deg,#ffb8df,#ed4d9f);outline:3px solid #fff39a;transform:scale(.93);box-shadow:0 0 16px #ff8bcf,inset 0 2px 5px #ffffff80}
.cell.hint-cell{outline:3px solid #baffeb;filter:brightness(1.25);animation:pulse .6s ease-in-out infinite alternate;box-shadow:0 0 17px #7affd9}
@keyframes pulse{to{transform:scale(.9)}}
.cell:disabled{cursor:default}
.actions{display:flex;gap:8px;margin:15px 0 12px}
.actions button,.modal button{flex:1;border:2px solid #fff;border-radius:14px;padding:14px 6px;font-weight:1000;font-size:14px;color:#fff;background:linear-gradient(180deg,#ff9bce,#e94c9c);text-shadow:0 1px 2px #9a286e;box-shadow:0 4px 0 #a9387c,0 7px 12px #81407840,inset 0 2px #fff9;cursor:pointer;transition:transform .12s}
.actions button:active,.modal button:active{transform:translateY(3px);box-shadow:0 1px 0 #a9387c}
.actions button.secondary{background:linear-gradient(180deg,#54dca7,#19a978);box-shadow:0 4px 0 #117e5b,0 7px 12px #427e6540,inset 0 2px #fff9}
.hint{text-align:center;color:#fff;font-size:12px;line-height:1.5;font-weight:900;margin:12px 0 10px;padding:11px 9px;border:2px solid #fff;border-radius:14px;background:linear-gradient(120deg,#6bdc67,#21b957);text-shadow:0 2px 2px #237d39;box-shadow:0 4px 0 #168a42,0 7px 13px #397c3d40}
footer{text-align:center;color:#8d4d83;font-size:11px;line-height:1.8;margin-top:15px;font-weight:800}
footer strong{color:#a83277;font-size:14px}
.overlay{position:fixed;inset:0;background:#44204bbd;backdrop-filter:blur(7px);display:none;place-items:center;padding:20px;z-index:5}
.overlay.show{display:grid}
.modal{width:min(100%,340px);background:linear-gradient(180deg,#ffb9df,#ed78bd 60%,#a05bc0);border:3px solid #fff;border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 8px 0 #8f3f83,0 20px 50px #30113c99,inset 0 2px #fff}
.modal h2{font-size:27px;margin:0 0 9px;color:#fff;text-shadow:0 3px 0 #a83c82}
.modal p{color:#fff;line-height:1.5;font-weight:700;text-shadow:0 1px 2px #8c3b78}
.modal button{width:100%;margin-top:8px;background:linear-gradient(180deg,#fff09b,#ffbd57);color:#91456e;text-shadow:none;box-shadow:0 4px 0 #bd7c36}
@media(max-width:360px){.board{gap:4px;padding:8px}.cell{border-radius:9px;font-size:clamp(32px,10vw,42px)}.stats{gap:4px;padding:6px}.stat{padding:6px 1px}.stat small{font-size:8px}.actions{gap:5px}.actions button{font-size:12px}}
</style>
</head>
<body>
<main>
<header><h1>🍬 Candy Match 3</h1><p>⭐ Sweet Puzzle Adventure ⭐</p></header>
<section class="stats" aria-label="Game status">
<div class="stat"><small>Score</small><strong id="score">0</strong></div>
<div class="stat"><small>Moves</small><strong id="moves">25</strong></div>
<div class="stat"><small>Level</small><strong id="level">1</strong></div>
<div class="stat"><small>Target</small><strong id="target">1200</strong></div>
</section>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<div class="board" id="board" aria-label="Candy game board"></div>
<div class="actions"><button id="hint">💡 Hint</button><button id="newGame">↻ New game</button><button class="secondary" id="sound">🔊 Sound</button></div>
<p class="hint" id="helpText">Swipe a candy up, down, left or right to swap. You can also tap two neighboring candies. Match 3 or more!</p>
<footer>🏆 Best score: <strong id="bestScore">0</strong><br>Your best score is saved on this device.</footer>
</main>
<div class="overlay" id="overlay"><div class="modal"><h2 id="resultTitle">Sweet!</h2><p id="resultText"></p><button id="playAgain">Play again</button></div></div>
<script>
(()=>{
const N=8, TYPES=['🍓','🍋','🍇','🍬','🍊','🫐'], START_MOVES=25;
let level=1,bestScore=Number(localStorage.getItem('candyBestScore')||0);
const targetScore=()=>1200+(level-1)*400;
let board=[],score=0,moves=START_MOVES,selected=-1,locked=false,sound=true,hintPair=[],suppressClick=false,touchStart=null;
const el=id=>document.getElementById(id), boardEl=el('board');
function rand(){return Math.floor(Math.random()*TYPES.length)}
function hasMatchAt(b,r,c){const v=b[r*N+c];if(v<0)return false;let n=1;for(let x=c-1;x>=0&&b[r*N+x]===v;x--)n++;for(let x=c+1;x<N&&b[r*N+x]===v;x++)n++;if(n>=3)return true;n=1;for(let y=r-1;y>=0&&b[y*N+c]===v;y--)n++;for(let y=r+1;y<N&&b[y*N+c]===v;y++)n++;return n>=3}
function makeBoard(){do{board=Array.from({length:N*N},rand)}while(findMatches().length)}
function findMatches(){const set=new Set();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=board[r*N+c];if(v<0)continue;let run=[r*N+c];for(let x=c+1;x<N&&board[r*N+x]===v;x++)run.push(r*N+x);if(run.length>=3)run.forEach(i=>set.add(i));run=[r*N+c];for(let y=r+1;y<N&&board[y*N+c]===v;y++)run.push(y*N+c);if(run.length>=3)run.forEach(i=>set.add(i))}return [...set]}
function render(){boardEl.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(selected===i?' selected':'')+(hintPair.includes(i)?' hint-cell':'');b.textContent=v<0?'':TYPES[v];b.setAttribute('aria-label',v<0?'Empty':TYPES[v]);b.disabled=locked||v<0;b.addEventListener('click',()=>tap(i));boardEl.appendChild(b)});el('score').textContent=score;el('moves').textContent=moves;el('target').textContent=targetScore();el('level').textContent=level;el('bestScore').textContent=bestScore;el('progress').style.width=Math.min(100,score/targetScore()*100)+'%'}
function tap(i){if(suppressClick){suppressClick=false;return}if(locked||moves<=0)return;hintPair=[];if(selected<0){selected=i;render();return}if(selected===i){selected=-1;render();return}const a=selected,b=i;selected=-1;if(Math.abs(a-b)===N||Math.floor(a/N)===Math.floor(b/N)&&Math.abs(a-b)===1){swap(a,b)}else{selected=i;render()}}
function swap(a,b){hintPair=[];[board[a],board[b]]=[board[b],board[a]];const m=findMatches();if(!m.length){[board[a],board[b]]=[board[b],board[a]];render();return}moves--;locked=true;render();resolve()}
function resolve(){let matches=findMatches();if(!matches.length){locked=false;render();checkEnd();if(moves>0&&!findMove())reshuffle();return}score+=matches.length*10;if(score>bestScore){bestScore=score;try{localStorage.setItem('candyBestScore',String(bestScore))}catch(e){}}matches.forEach(i=>board[i]=-1);render();setTimeout(()=>{for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--){const v=board[r*N+c];if(v>=0)vals.push(v)}for(let r=N-1;r>=0;r--)board[r*N+c]=vals[N-1-r]??rand()}render();setTimeout(resolve,130)},150)}
function checkEnd(){if(score>=targetScore()){locked=true;el('playAgain').textContent='Next level ➜';el('resultTitle').textContent='🎉 Level '+level+' complete!';el('resultText').textContent='Fantastic! You reached '+targetScore()+' points. Level '+(level+1)+' is ready!';el('overlay').classList.add('show')}else if(moves<=0){locked=true;el('playAgain').textContent='Try again';showResult('Good try!','You scored '+score+' points. Reach '+targetScore()+' to pass this level.')}}
function findMove(){for(let a=0;a<N*N;a++){const r=Math.floor(a/N),c=a%N;for(const b of [c<N-1?a+1:-1,r<N-1?a+N:-1]){if(b<0)continue;[board[a],board[b]]=[board[b],board[a]];const ok=findMatches().length>0;[board[a],board[b]]=[board[b],board[a]];if(ok)return [a,b]}}return null}
function hint(){if(locked||moves<=0)return;const pair=findMove();if(!pair){reshuffle();return}hintPair=pair;selected=-1;render();el('helpText').textContent='Try swapping the two glowing candies!'}
function reshuffle(){do{board=Array.from({length:N*N},rand)}while(findMatches().length||!findMove());hintPair=[];selected=-1;render();el('helpText').textContent='Board shuffled — keep matching!'}
function showResult(t,p){el('resultTitle').textContent=t;el('resultText').textContent=p;el('overlay').classList.add('show')}
function startLevel(){score=0;moves=START_MOVES;selected=-1;locked=false;hintPair=[];el('overlay').classList.remove('show');el('playAgain').textContent='Try again';makeBoard();render()}
function newGame(){level=1;startLevel()}
function continueGame(){const won=score>=targetScore();if(won){level=level+1;}startLevel();if(won){el('helpText').textContent='🌟 Welcome to Level '+level+'! Target: '+targetScore()+' points. Good luck!'}else{el('helpText').textContent='New try! Match 3 or more candies to reach the target.'}}
el('hint').addEventListener('click',hint);
boardEl.addEventListener('pointerdown',e=>{const cell=e.target.closest('.cell');if(!cell||locked)return;touchStart={index:[...boardEl.children].indexOf(cell),x:e.clientX,y:e.clientY};});
boardEl.addEventListener('pointerup',e=>{if(!touchStart)return;const start=touchStart;touchStart=null;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;const dest=Math.abs(dx)>Math.abs(dy)?start.index+(dx>0?1:-1):start.index+(dy>0?N:-N);if(dest<0||dest>=N*N||Math.floor(dest/N)!==Math.floor(start.index/N)&&Math.abs(dest-start.index)===1)return;suppressClick=true;selected=-1;swap(start.index,dest);});
el('newGame').addEventListener('click',newGame);el('playAgain').addEventListener('click',continueGame);el('sound').addEventListener('click',()=>{sound=!sound;el('sound').textContent=sound?'🔊 Sound on':'🔇 Sound off'});
newGame();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body></html>
